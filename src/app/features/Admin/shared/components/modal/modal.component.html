<!-- Modal overlay with animation -->
<div
  *ngIf="visible"
  class="fixed inset-0 bg-black bg-opacity-50 z-40 flex items-center justify-center transition-opacity"
  [class.opacity-0]="!showContent"
  [class.opacity-100]="showContent"
  (click)="onBackdropClick($event)"
>
  <!-- Modal container with animation -->
  <div
    class="bg-white rounded-lg shadow-xl max-w-4xl w-full mx-4 max-h-[90vh] overflow-auto transition-all duration-300 ease-out"
    [class.opacity-0]="!showContent"
    [class.opacity-100]="showContent"
    [class.translate-y-4]="!showContent"
    [class.translate-y-0]="showContent"
  >
    <!-- Modal header -->
    <div class="flex justify-between items-center p-4 border-b">
      <h2 class="text-xl font-semibold text-gray-800">
        {{ title }}
        <!-- Loading indicator in header -->
        <span
          *ngIf="isLoading"
          class="ml-2 inline-flex items-center text-sm font-normal text-blue-600"
        >
          <svg
            class="animate-spin -ml-1 mr-2 h-4 w-4 text-blue-600"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
          >
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
            ></circle>
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
            ></path>
          </svg>
          {{ loadingMessage }}
        </span>
      </h2>
      <button
        type="button"
        class="text-gray-400 hover:text-gray-500 focus:outline-none"
        [disabled]="isLoading"
        (click)="close()"
      >
        <svg
          class="h-6 w-6"
          [class.opacity-50]="isLoading"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
    </div>

    <!-- Modal body -->
    <div class="p-6">
      <ng-content></ng-content>
    </div>
  </div>
</div>
