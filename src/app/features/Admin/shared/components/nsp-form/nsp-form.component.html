<div class="bg-white p-6 rounded-lg shadow-md">
  <h2 class="text-xl font-semibold text-gray-800 mb-4">
    {{ isEdit ? 'Edit NSP' : 'Create New NSP' }}
  </h2>
  
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <!-- First Name field -->
    <div class="mb-4">
      <label for="firstName" class="block text-sm font-medium text-gray-700 mb-1">First Name</label>
      <input
        type="text"
        id="firstName"
        formControlName="firstName"
        class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        [ngClass]="{'border-red-500': hasError('firstName', 'required') || hasError('firstName', 'minlength')}"
        placeholder="John"
      >
      <div *ngIf="hasError('firstName', 'required')" class="text-red-500 text-xs mt-1">
        First name is required
      </div>
      <div *ngIf="hasError('firstName', 'minlength')" class="text-red-500 text-xs mt-1">
        First name must be at least 3 characters
      </div>
    </div>
    
    <!-- Middle Name field (optional) -->
    <div class="mb-4">
      <label for="middleName" class="block text-sm font-medium text-gray-700 mb-1">Middle Name (Optional)</label>
      <input
        type="text"
        id="middleName"
        formControlName="middleName"
        class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        placeholder="Michael"
      >
    </div>
    
    <!-- Last Name field -->
    <div class="mb-4">
      <label for="lastName" class="block text-sm font-medium text-gray-700 mb-1">Last Name</label>
      <input
        type="text"
        id="lastName"
        formControlName="lastName"
        class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        [ngClass]="{'border-red-500': hasError('lastName', 'required') || hasError('lastName', 'minlength')}"
        placeholder="Doe"
      >
      <div *ngIf="hasError('lastName', 'required')" class="text-red-500 text-xs mt-1">
        Last name is required
      </div>
      <div *ngIf="hasError('lastName', 'minlength')" class="text-red-500 text-xs mt-1">
        Last name must be at least 3 characters
      </div>
    </div>
    
    <!-- Email field -->
    <div class="mb-4">
      <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
      <input
        type="email"
        id="email"
        formControlName="email"
        class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        [ngClass]="{'border-red-500': hasError('email', 'required') || hasError('email', 'email')}"
        placeholder="john.doe@example.com"
      >
      <div *ngIf="hasError('email', 'required')" class="text-red-500 text-xs mt-1">
        Email is required
      </div>
      <div *ngIf="hasError('email', 'email')" class="text-red-500 text-xs mt-1">
        Please enter a valid email address
      </div>
    </div>
    
    <!-- Form actions -->
    <div class="flex justify-end space-x-3 pt-4 border-t border-gray-200">
      <app-button
        type="button" 
        variant="secondary"
        size="md"
        [disabled]="isSubmitting"
        (buttonClick)="onCancel()">
        Cancel
      </app-button>
      <app-button
        type="submit" 
        variant="primary"
        size="md"
        [disabled]="form.invalid || isSubmitting"
        [loading]="isSubmitting">
        {{ isEdit ? 'Update' : 'Create' }}
      </app-button>
    </div>
  </form>
</div>
