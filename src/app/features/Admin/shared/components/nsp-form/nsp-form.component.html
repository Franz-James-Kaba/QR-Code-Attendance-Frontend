<form [formGroup]="nspForm" (ngSubmit)="onSubmit()" class="space-y-4">
  <!-- NSP ID field (read-only) -->
  <div class="space-y-2">
    <label class="block text-sm font-medium text-gray-700" for="id">NSP ID</label>
    <input
      type="text"
      id="id"
      formControlName="id"
      readonly
      class="w-full px-3 py-2 bg-gray-100 border border-gray-300 rounded-md shadow-sm focus:outline-none"
    />
  </div>

  <!-- Name field -->
  <div class="space-y-2">
    <label class="block text-sm font-medium text-gray-700" for="name">Name</label>
    <input
      type="text"
      id="name"
      formControlName="name"
      class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
    />
    <div *ngIf="nspForm.get('name')?.invalid && nspForm.get('name')?.touched" class="text-red-500 text-sm">
      Name is required
    </div>
  </div>

  <!-- Stack field -->
  <div class="space-y-2">
    <label class="block text-sm font-medium text-gray-700" for="stack">Stack</label>
    <select
      id="stack"
      formControlName="stack"
      class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
    >
      <option value="">Select a stack</option>
      <option value="Frontend">Frontend</option>
      <option value="Backend">Backend</option>
      <option value="FullStack">FullStack</option>
    </select>
    <div *ngIf="nspForm.get('stack')?.invalid && nspForm.get('stack')?.touched" class="text-red-500 text-sm">
      Stack is required
    </div>
  </div>

  <!-- Status field -->
  <div class="space-y-2">
    <label class="block text-sm font-medium text-gray-700" for="status">Status</label>
    <select
      id="status"
      formControlName="status"
      class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
    >
      <option value="Active">Active</option>
      <option value="Inactive">Inactive</option>
      <option value="On Leave">On Leave</option>
    </select>
    <div *ngIf="nspForm.get('status')?.invalid && nspForm.get('status')?.touched" class="text-red-500 text-sm">
      Status is required
    </div>
  </div>

  <!-- Email field -->
  <div class="space-y-2">
    <label class="block text-sm font-medium text-gray-700" for="email">Email</label>
    <input
      type="email"
      id="email"
      formControlName="email"
      class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
    />
    <div *ngIf="nspForm.get('email')?.errors?.['required'] && nspForm.get('email')?.touched" class="text-red-500 text-sm">
      Email is required
    </div>
    <div *ngIf="nspForm.get('email')?.errors?.['email'] && nspForm.get('email')?.touched" class="text-red-500 text-sm">
      Please enter a valid email
    </div>
  </div>

  <!-- Phone field -->
  <div class="space-y-2">
    <label class="block text-sm font-medium text-gray-700" for="phone">Phone</label>
    <input
      type="tel"
      id="phone"
      formControlName="phone"
      class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
    />
    <div *ngIf="nspForm.get('phone')?.invalid && nspForm.get('phone')?.touched" class="text-red-500 text-sm">
      Phone is required
    </div>
  </div>

  <!-- Program field -->
  <div class="space-y-2">
    <label class="block text-sm font-medium text-gray-700" for="program">Program</label>
    <select
      id="program"
      formControlName="program"
      class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
    >
      <option value="">Select a program</option>
      <option value="Web Development">Web Development</option>
      <option value="Data Science">Data Science</option>
      <option value="Mobile Development">Mobile Development</option>
    </select>
    <div *ngIf="nspForm.get('program')?.invalid && nspForm.get('program')?.touched" class="text-red-500 text-sm">
      Program is required
    </div>
  </div>

  <!-- Join Date field -->
  <div class="space-y-2">
    <label class="block text-sm font-medium text-gray-700" for="joinDate">Join Date</label>
    <input
      type="date"
      id="joinDate"
      formControlName="joinDate"
      class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
    />
    <div *ngIf="nspForm.get('joinDate')?.invalid && nspForm.get('joinDate')?.touched" class="text-red-500 text-sm">
      Join Date is required
    </div>
  </div>

  <!-- Action Buttons -->
  <div class="flex justify-end space-x-3 pt-4">
    <app-button
      type="button" 
      variant="secondary"
      size="md"
      (buttonClick)="onCancel()">
      Cancel
    </app-button>
    <app-button
      type="submit" 
      variant="primary"
      size="md"
      [loading]="isSubmitting">
      {{ isEditMode ? 'Update' : 'Create' }} NSP
    </app-button>
  </div>
</form>
