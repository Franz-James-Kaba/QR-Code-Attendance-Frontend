<!-- NSP Table with list of NSPs -->
<div class="bg-white rounded-lg shadow overflow-hidden">
  <table class="min-w-full divide-y divide-gray-200">
    <!-- Table header row -->
    <thead class="bg-[#0074B7] text-white">
      <tr>
        <th scope="col" class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">
          NSP Name
        </th>
        <th scope="col" class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">
          Email
        </th>
        <th scope="col" class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">
          Role
        </th>
        <th scope="col" class="px-6 py-3 text-right text-xs font-medium uppercase tracking-wider">
          Actions
        </th>
      </tr>
    </thead>
    <!-- Table body -->
    <tbody class="bg-white divide-y divide-gray-200">
      <tr *ngFor="let nsp of nsps">
        <td class="px-6 py-4 whitespace-nowrap">
          <div class="flex items-center">
            <div
              class="flex-shrink-0 h-10 w-10 bg-gray-100 rounded-full flex items-center justify-center text-gray-500"
            >
              {{ getInitials(nsp) }}
            </div>
            <div class="ml-4">
              <div class="text-sm font-medium text-gray-900">{{ getFullName(nsp) }}</div>
              <div *ngIf="nsp.createdAt" class="text-xs text-gray-500">
                Joined {{ nsp.createdAt | date: 'mediumDate' }}
              </div>
            </div>
          </div>
        </td>
        <td class="px-6 py-4 whitespace-nowrap">
          <div class="text-sm text-gray-900">{{ nsp.email }}</div>
        </td>
        <td class="px-6 py-4 whitespace-nowrap">
          <span
            class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-blue-100 text-blue-800"
          >
            {{ nsp.role || 'NSP' }}
          </span>
          <span
            *ngIf="nsp.passwordResetRequired"
            class="ml-2 px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-yellow-100 text-yellow-800"
          >
            Password Reset Required
          </span>
        </td>
        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
          <div class="flex justify-end space-x-2">
            <!-- Edit button -->
            <button
              (click)="onEdit(nsp)"
              class="text-blue-600 hover:text-blue-900 bg-blue-50 p-2 rounded-full"
              title="Edit NSP"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5"
                viewBox="0 0 20 20"
                fill="currentColor"
              >
                <path
                  d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"
                />
              </svg>
            </button>
            <!-- Delete button -->
            <button
              (click)="onDelete(nsp)"
              class="text-red-600 hover:text-red-900 bg-red-50 p-2 rounded-full"
              title="Delete NSP"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5"
                viewBox="0 0 20 20"
                fill="currentColor"
              >
                <path
                  fill-rule="evenodd"
                  d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z"
                  clip-rule="evenodd"
                />
              </svg>
            </button>
          </div>
        </td>
      </tr>

      <!-- Empty state within table when no records -->
      <tr *ngIf="nsps.length === 0">
        <td colspan="4" class="px-6 py-12 text-center">
          <div class="flex flex-col items-center justify-center text-gray-500">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" class="w-16 h-16 mb-4">
              <path
                fill="currentColor"
                d="M232,128a8,8,0,0,1-4,6.93l-96,56a8,8,0,0,1-8.06,0l-96-56A8,8,0,0,1,24,128V72a8,8,0,0,1,12-6.93l92,53.65,92-53.65A8,8,0,0,1,232,72ZM128,48,40,96l88,48,88-48ZM36,184V135.43l84,49V233Zm100,49V184.43l84-49V184Z"
              ></path>
            </svg>
            <p class="text-lg font-medium">No Record Found</p>
            <p class="text-sm mt-1">Create your first NSP to get started</p>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
