<!-- Success notification banner -->
<div *ngIf="showSuccessMessage" class="bg-green-100 border-l-4 border-green-500 text-green-700 p-4 mb-4 rounded">
  <div class="flex items-center">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor">
      <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
    </svg>
    <span>{{ successMessage }}</span>
  </div>
</div>

<!-- NSP Table header with action button -->
<div class="flex justify-between items-center mb-6">
  <h2 class="text-2xl font-bold text-gray-800">NSP Overview</h2>
  <app-button
    variant="primary"
    size="md"
    [svgIcon]="
      `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>
        <circle cx='12' cy='12' r='10'></circle>
        <line x1='12' y1='8' x2='12' y2='16'></line>
        <line x1='8' y1='12' x2='16' y2='12'></line>
      </svg>`
    "
    iconPosition="left"
    (buttonClick)="onCreateNsp()">
    Create NSP
  </app-button>
</div>

<!-- NSP Table with list of NSPs -->
<div class="bg-white rounded-lg shadow overflow-hidden">
  <table class="min-w-full divide-y divide-gray-200">
    <!-- Table header row -->
    <thead class="bg-[#0074B7] text-white">
      <tr>
        <th scope="col" class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">
          NSP Name
        </th>
        <th scope="col" class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">
          Stack
        </th>
        <th scope="col" class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">
          Status
        </th>
        <th scope="col" class="px-6 py-3 text-right text-xs font-medium uppercase tracking-wider">
          Actions
        </th>
      </tr>
    </thead>
    <!-- Table body -->
    <tbody class="bg-white divide-y divide-gray-200">
      <tr *ngFor="let nsp of nsps">
        <td class="px-6 py-4 whitespace-nowrap">
          <div class="flex items-center">
            <div class="flex-shrink-0 h-10 w-10 bg-gray-100 rounded-full flex items-center justify-center text-gray-500">
              {{ nsp.name.charAt(0) }}{{ nsp.name.split(' ')[1]?.charAt(0) || '' }}
            </div>
            <div class="ml-4">
              <div class="text-sm font-medium text-gray-900">{{ nsp.name }}</div>
              <div class="text-sm text-gray-500">{{ nsp.email }}</div>
            </div>
          </div>
        </td>
        <td class="px-6 py-4 whitespace-nowrap">
          <div class="text-sm text-gray-900">{{ nsp.stack }}</div>
          <div class="text-sm text-gray-500">{{ nsp.program }}</div>
        </td>
        <td class="px-6 py-4 whitespace-nowrap">
          <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full" [ngClass]="getStatusClass(nsp.status)">
            {{ nsp.status }}
          </span>
        </td>
        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
          <div class="flex justify-end space-x-2">
            <!-- Edit button -->
            <button
              (click)="onEdit(nsp)"
              class="text-blue-600 hover:text-blue-900 bg-blue-50 p-2 rounded-full"
              title="Edit NSP">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" />
              </svg>
            </button>
            <!-- Delete button -->
            <button
              (click)="onDelete(nsp)"
              class="text-red-600 hover:text-red-900 bg-red-50 p-2 rounded-full"
              title="Delete NSP">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
              </svg>
            </button>
          </div>
        </td>
      </tr>

      <!-- Empty state within table when no records -->
      <tr *ngIf="nsps.length === 0">
        <td colspan="4" class="px-6 py-12 text-center">
          <div class="flex flex-col items-center justify-center text-gray-500">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" class="w-16 h-16 mb-4">
              <path fill="currentColor" d="M232,128a8,8,0,0,1-4,6.93l-96,56a8,8,0,0,1-8.06,0l-96-56A8,8,0,0,1,24,128V72a8,8,0,0,1,12-6.93l92,53.65,92-53.65A8,8,0,0,1,232,72ZM128,48,40,96l88,48,88-48ZM36,184V135.43l84,49V233Zm100,49V184.43l84-49V184Z"></path>
            </svg>
            <p class="text-lg font-medium">No Record Found</p>
            <p class="text-sm mt-1">Create your first NSP to get started</p>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
