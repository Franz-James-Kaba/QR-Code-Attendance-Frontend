<header
  class="sticky top-0 z-30 flex items-center h-16 transition-all duration-300 bg-white shadow"
  [class.shadow]="isScrolled"
>
  <div class="flex items-center justify-between w-full px-4">
    <!-- Left side: Toggle button + Breadcrumbs -->
    <div class="flex items-center space-x-4">
      <!-- Mobile Menu Toggle -->      <button
        type="button"
        class="p-2 rounded-lg hover:bg-gray-100 md:hidden"
        (click)="onToggleSidebar()"
        aria-label="Toggle sidebar"
      >
        <svg class="w-6 h-6 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5">
          </path>
        </svg>
      </button><!-- Breadcrumbs -->
      <app-breadcrumb
        [items]="breadcrumbs"
        class="hidden md:block"
      ></app-breadcrumb>
    </div>

    <!-- Right side: Notification + User Badge -->
    <div class="flex items-center space-x-2">
      <!-- Notification bell -->
      <div class="relative">        <button
          type="button"
          (click)="onToggleNotifications()"
          class="relative p-2 rounded-lg hover:bg-gray-100"
          aria-label="View notifications"
        >
          <svg class="w-6 h-6 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0">
            </path>
          </svg>

          <!-- Notification indicator -->
          @if (unreadCount > 0) {
            <span
              class="absolute top-1.5 right-1.5 w-2.5 h-2.5 bg-red-500 rounded-full">
            </span>
          }
        </button>

        <!-- Notification dropdown -->
        @if (showNotificationDropdown) {
          <div class="absolute right-0 mt-2 z-50" clickOutside (clickOutside)="onClickOutside()">
            <app-notification-dropdown
              (closeDropdown)="showNotificationDropdown = false"
            ></app-notification-dropdown>
          </div>
        }
      </div>

      <!-- User badge - desktop -->
      <div class="relative">
        <button
          type="button"
          class="cursor-pointer flex items-center"
          (click)="onUserBadgeClick()"
          (keydown)="onUserBadgeKeyDown($event)"
          aria-haspopup="true"
          [attr.aria-expanded]="showUserDropdown"
          aria-label="User profile menu"
        >
          <app-user-badge
            [firstName]="getUserFirstName()"
            [lastName]="getUserLastName()"
            [userRole]="currentUser().role"
            [avatarSrc]="currentUser().avatar ?? ''"
            [clickable]="true"
          ></app-user-badge>
        </button>

        <!-- User dropdown menu -->
        @if (showUserDropdown) {
          <div class="absolute right-0 mt-2 z-50" clickOutside (clickOutside)="onClickOutside()">
            <app-profile-dropdown (closeDropdown)="showUserDropdown = false"></app-profile-dropdown>
          </div>
        }
      </div>
    </div>
  </div>
</header>
