<header
  class="sticky top-0 z-30 flex items-center h-16 transition-all duration-300 bg-white shadow"
  [class.shadow]="isScrolled"
>
  <div class="flex items-center justify-between w-full px-4">
    <!-- Left side: Toggle button + Breadcrumbs -->
    <div class="flex items-center space-x-4">
      <!-- Mobile Menu Toggle -->
      <button
        type="button"
        class="p-2 rounded-lg hover:bg-gray-100 md:hidden"
        (click)="onToggleSidebar()"
        aria-label="Toggle sidebar"
      >
        <app-icon [path]="MENU_ICON_PATH" class="w-6 h-6 text-gray-700" />
      </button>

      <!-- Breadcrumbs -->
      <app-breadcrumb
        [items]="breadcrumbs"
        class="hidden md:block"
      ></app-breadcrumb>
    </div>

    <!-- Right side: Notification + User Badge -->
    <div class="flex items-center space-x-2">
      <!-- Notification bell -->
      <div class="relative">
        <button
          type="button"
          (click)="onToggleNotifications()"
          class="relative p-2 rounded-lg hover:bg-gray-100"
          aria-label="View notifications"
        >
          <app-icon [path]="BELL_ICON_PATH" class="w-6 h-6 text-gray-700" />

          <!-- Notification indicator -->
          @if (unreadCount > 0) {
            <span
              class="absolute top-1.5 right-1.5 w-2.5 h-2.5 bg-red-500 rounded-full"
            ></span>
          }
        </button>

        <!-- Notification dropdown -->
        @if (showNotificationDropdown) {
          <div
            class="absolute right-0 mt-2 z-50"
            clickOutside
            (clickOutside)="onClickOutside()"
          >
            <app-notification-dropdown
              (closeDropdown)="showNotificationDropdown = false"
            ></app-notification-dropdown>
          </div>
        }
      </div>

      <!-- User badge - desktop -->
      <div class="relative">
        <app-user-badge
          [userName]="currentUser().name"
          [userRole]="currentUser().role"
          [userAvatar]="currentUser().avatar ?? ''"
          (click)="onUserBadgeClick()"
          (keydown)="onUserBadgeKeyDown($event)"
          tabindex="0"
          role="button"
          aria-haspopup="true"
          [attr.aria-expanded]="showUserDropdown"
          aria-label="User profile menu"
          [clickable]="true"
          class="cursor-pointer"
        ></app-user-badge>

        <!-- User dropdown menu -->
        @if (showUserDropdown) {
          <div
            class="absolute right-0 mt-2 z-50"
            clickOutside
            (clickOutside)="onClickOutside()"
          >
            <app-profile-dropdown
              (closeDropdown)="showUserDropdown = false"
            ></app-profile-dropdown>
          </div>
        }
      </div>
    </div>
  </div>
</header>
