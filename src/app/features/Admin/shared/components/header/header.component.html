<header
  class="sticky top-0 z-30 flex items-center h-16 transition-all duration-300 bg-white shadow"
  [class.shadow]="isScrolled"
>
  <div class="flex items-center justify-between w-full px-4">
    <!-- Left side: Toggle button + Breadcrumbs -->
    <div class="flex items-center space-x-4">
      <!-- Mobile Menu Toggle -->
      <button
        type="button"
        class="p-2 rounded-lg hover:bg-gray-100 md:hidden"
        (click)="onToggleSidebar()"
        aria-label="Toggle sidebar"
      >
        <app-icon [path]="MENU_ICON_PATH" class="w-6 h-6 text-gray-700" />
      </button>

      <!-- Breadcrumbs -->
      <app-breadcrumb
        [items]="breadcrumbs"
        class="hidden md:block"
      ></app-breadcrumb>
    </div>

    <!-- Right side: Notification + User Badge -->
    <div class="flex items-center space-x-2">
      <!-- Notification bell -->
      <button
        type="button"
        class="relative p-2 rounded-lg hover:bg-gray-100"
        aria-label="View notifications"
      >
        <app-icon [path]="BELL_ICON_PATH" class="w-6 h-6 text-gray-700" />

        <!-- Notification indicator -->
        @if (hasNotifications) {
          <span
            class="absolute top-1.5 right-1.5 w-2.5 h-2.5 bg-red-500 rounded-full"
          ></span>
        }
      </button>

      <!-- User badge - desktop -->
      <div class="relative">
        <app-user-badge
          (click)="onUserBadgeClick()"
          (keydown)="onUserBadgeKeyDown($event)"
          tabindex="0"
          role="button"
          aria-haspopup="true"
          [attr.aria-expanded]="showUserDropdown"
          class="cursor-pointer"
        ></app-user-badge>

        <!-- User dropdown menu -->
        @if (showUserDropdown) {
          <div
            clickOutside
            (clickOutside)="onClickOutside()"
            class="absolute right-0 z-40 mt-2 w-48 bg-white rounded-lg shadow-lg py-1"
          >
            <a
              href="#"
              class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100"
            >
              Profile
            </a>
            <a
              href="#"
              class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100"
            >
              Settings
            </a>
            <div class="my-1 border-t border-gray-200"></div>
            <a
              href="#"
              class="block px-4 py-2 text-sm text-red-600 hover:bg-gray-100"
            >
              Sign out
            </a>
          </div>
        }
      </div>
    </div>
  </div>
</header>
