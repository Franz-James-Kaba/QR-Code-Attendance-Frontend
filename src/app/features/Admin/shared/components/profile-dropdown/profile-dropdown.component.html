<div class="profile-dropdown rounded-lg shadow-lg bg-white overflow-hidden w-64">
  <!-- User info section -->
  <div class="px-4 py-4 border-b">
    <div class="flex items-center">
      @if (currentUser().avatar) {
        <img
          [src]="currentUser().avatar"
          alt="User avatar"
          class="w-10 h-10 rounded-full object-cover mr-3"
        />
      } @else {
        <div
          class="w-10 h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center mr-3 font-bold"
        >
          {{ currentUser().name.charAt(0).toUpperCase() }}
        </div>
      }
      <div class="overflow-hidden">
        <p class="font-medium text-gray-900 truncate">{{ currentUser().name }}</p>
        <p class="text-sm text-gray-500 truncate">{{ currentUser().email }}</p>
        <div class="mt-1">
          <span class="text-xs font-medium px-2 py-0.5 rounded-full bg-blue-100 text-blue-800">
            {{ currentUser().role }}
          </span>
        </div>
      </div>
    </div>
  </div>
  <!-- Menu items -->
  <div class="py-1">
    <a
      routerLink="/admin/profile"
      class="block px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-100 transition duration-150"
    >
      <div class="flex items-center">
        <svg
          class="w-5 h-5 mr-2.5 text-gray-500"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
          ></path>
        </svg>
        <span>My Profile</span>
      </div>
    </a>
    <a
      routerLink="/admin/settings"
      class="block px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-100 transition duration-150"
    >
      <div class="flex items-center">
        <svg
          class="w-5 h-5 mr-2.5 text-gray-500"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
          ></path>
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
          ></path>
        </svg>
        <span>Settings</span>
      </div>
    </a>
    <a
      routerLink="/admin/activity"
      class="block px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-100 transition duration-150"
    >
      <div class="flex items-center">
        <svg
          class="w-5 h-5 mr-2.5 text-gray-500"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"
          ></path>
        </svg>
        <span>Activity Log</span>
      </div>
    </a>
  </div>
  <!-- Separator -->
  <div class="border-t border-gray-200"></div>

  <!-- Logout button -->
  <div class="py-1">
    <button
      (click)="onLogout()"
      class="block w-full text-left px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 transition duration-150"
    >
      <div class="flex items-center">
        <svg
          class="w-5 h-5 mr-2.5 text-red-600"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
          ></path>
        </svg>
        <span>Sign out</span>
      </div>
    </button>
  </div>
</div>
