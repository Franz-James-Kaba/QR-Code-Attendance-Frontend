<div class="bg-white p-6 rounded-lg shadow-md">
  <h2 class="text-xl font-semibold text-gray-800 mb-4">Import Multiple NSPs</h2>

  <!-- File upload area -->
  <div class="mb-6">
    <label class="block text-sm font-medium text-gray-700 mb-2" [htmlFor]="fileInput">
      Upload CSV file with NSP data
    </label>

    <div
      class="border-2 border-dashed border-gray-300 rounded-md p-6 flex flex-col items-center justify-center cursor-pointer hover:bg-gray-50"
      (click)="fileInput.click()"
      [class.bg-red-50]="parseError"
      [class.border-red-300]="parseError"
      (onkeypress)="fileInput.click()"
      >

      <input #fileInput type="file" class="hidden" accept=".csv" (change)="onFileSelected($event)">

      <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-gray-400 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
      </svg>

      <div *ngIf="!fileName; else fileSelected" class="text-center">
        <p class="text-sm text-gray-600">Click to browse or drag and drop</p>
        <p class="text-xs text-gray-500 mt-1">CSV files only</p>
      </div>

      <ng-template #fileSelected>
        <p class="text-sm font-medium text-gray-700">{{ fileName }}</p>
        <p class="text-xs text-gray-500 mt-1">{{ nsps.length }} records found</p>
      </ng-template>
    </div>

    <!-- Error message display -->
    <div *ngIf="parseError" class="mt-2 text-sm text-red-600">
      {{ parseError }}
    </div>

    <!-- Processing message -->
    <div *ngIf="isProcessing" class="mt-2 text-sm text-blue-600 flex items-center">
      <svg class="animate-spin h-4 w-4 mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
      Processing file...
    </div>
  </div>

  <!-- Template download link -->
  <div class="mb-6">
    <button
      type="button"
      class="inline-flex items-center text-sm text-blue-600 hover:text-blue-800"
      (click)="downloadTemplate()">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
      </svg>
      Download CSV Template
    </button>
  </div>

  <!-- Validation errors -->
  <div *ngIf="validationErrors.length > 0" class="mb-6 p-3 bg-red-50 border border-red-200 rounded-md">
    <p class="text-sm font-medium text-red-800 mb-2">Please fix the following issues:</p>
    <ul class="text-xs text-red-700 list-disc list-inside">
      <li *ngFor="let error of validationErrors">{{ error }}</li>
    </ul>
  </div>

  <!-- Summary of records to import -->
  <div *ngIf="nsps.length > 0 && validationErrors.length === 0" class="mb-6 p-3 bg-green-50 border border-green-200 rounded-md">
    <p class="text-sm font-medium text-green-800">Ready to import {{ nsps.length }} NSP records</p>
  </div>

  <!-- Action buttons -->
  <div class="flex justify-end space-x-3 pt-4 border-t border-gray-200">
    <app-button
      type="button"
      variant="secondary"
      size="md"
      [disabled]="isUploading"
      (buttonClick)="onCancel()">
      Cancel
    </app-button>
    <app-button
      type="button"
      variant="primary"
      size="md"
      [disabled]="!nsps.length || validationErrors.length > 0 || isUploading"
      [loading]="isUploading"
      (buttonClick)="onSubmit()">
      Import NSPs
    </app-button>
  </div>
</div>
