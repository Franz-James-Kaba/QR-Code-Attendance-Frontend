<form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">
  <!-- QR Code Icon -->
  <div class="flex justify-center mb-6">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-24 w-24 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
      <rect x="7" y="7" width="3" height="3"></rect>
      <rect x="14" y="7" width="3" height="3"></rect>
      <rect x="7" y="14" width="3" height="3"></rect>
      <rect x="14" y="14" width="3" height="3"></rect>
    </svg>
  </div>

  <!-- Session Name -->
  <div class="form-group">
    <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Session Name *</label>
    <input
      type="text"
      id="name"
      formControlName="name"
      class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary-500 focus:border-primary-500"
      placeholder="Enter session name"
    >
    <div *ngIf="hasError('name', 'required')" class="text-red-500 text-sm mt-1">
      Session name is required
    </div>
    <div *ngIf="hasError('name', 'minlength')" class="text-red-500 text-sm mt-1">
      Session name must be at least 3 characters
    </div>
    <div *ngIf="hasError('name', 'maxlength')" class="text-red-500 text-sm mt-1">
      Session name cannot exceed 100 characters
    </div>
  </div>

  <!-- Start Time and End Time in a flex container -->
  <div class="grid grid-cols-2 gap-4">
    <!-- Start Time -->
    <div class="form-group">
      <label for="startTime" class="block text-sm font-medium text-gray-700 mb-1">Start Time *</label>
      <input
        type="datetime-local"
        id="startTime"
        formControlName="startTime"
        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary-500 focus:border-primary-500"
      >
      <div *ngIf="hasError('startTime', 'required')" class="text-red-500 text-sm mt-1">
        Start time is required
      </div>
      <div *ngIf="form.get('startTime')?.touched && !isStartDateValid()" class="text-red-500 text-sm mt-1">
        Start time must be in the future
      </div>
    </div>

    <!-- End Time -->
    <div class="form-group">
      <label for="endTime" class="block text-sm font-medium text-gray-700 mb-1">End Time *</label>
      <input
        type="datetime-local"
        id="endTime"
        formControlName="endTime"
        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary-500 focus:border-primary-500"
      >
      <div *ngIf="hasError('endTime', 'required')" class="text-red-500 text-sm mt-1">
        End time is required
      </div>
      <div *ngIf="form.get('endTime')?.touched && !isEndDateValid()" class="text-red-500 text-sm mt-1">
        End time must be after start time
      </div>
    </div>
  </div>

  <!-- Location (Optional) -->
  <div class="form-group">
    <label for="location" class="block text-sm font-medium text-gray-700 mb-1">Location (Optional)</label>
    <input
      type="text"
      id="location"
      formControlName="location"
      class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary-500 focus:border-primary-500"
      placeholder="Enter location"
    >
  </div>

  <!-- Description (Optional) -->
  <div class="form-group">
    <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Description (Optional)</label>
    <textarea
      id="description"
      formControlName="description"
      class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary-500 focus:border-primary-500"
      placeholder="Enter description"
      rows="3"
    ></textarea>
  </div>

  <!-- Action Buttons -->
  <div class="flex justify-center space-x-3 pt-6">
    <app-button
      type="button"
      variant="secondary"
      size="md"
      [disabled]="isSubmitting"
      (click)="onCancel()"
      onkeypress="onKeyPress($event)"
    >
      Cancel
    </app-button>
    <app-button
      type="submit"
      variant="primary"
      size="md"
      [disabled]="form.invalid || isSubmitting"
      [loading]="isSubmitting"
    >
      {{ isEdit ? 'Update Session' : 'Create Session' }}
    </app-button>
  </div>
</form>
