<div
  [ngClass]="[
    avatarOnly ? '' : 'flex items-center gap-2',
    clickable ? 'cursor-pointer' : '',
    customClass,
  ]"
  (click)="onBadgeClick()"
  onkeypress="onBadgeClick()"
>
  <div class="relative">
    @if (userAvatar) {
      <img
        [src]="userAvatar"
        alt="{{ userName }}'s avatar"
        [ngClass]="[sizeClasses, 'rounded-full object-cover border border-gray-200']"
      />
    } @else {
      <div
        [ngClass]="[
          sizeClasses,
          'rounded-full bg-gray-200 flex items-center justify-center text-gray-700 font-semibold',
        ]"
      >
        {{ userName.charAt(0).toUpperCase() }}
      </div>
    }

    <!-- Status indicator -->
    @if (status !== 'none') {
      <span
        [ngClass]="[
          statusClasses,
          'absolute bottom-0 right-0 block rounded-full border-2 border-white',
        ]"
        [style.width.px]="size === 'sm' ? 8 : size === 'md' ? 10 : 12"
        [style.height.px]="size === 'sm' ? 8 : size === 'md' ? 10 : 12"
        aria-hidden="true"
      ></span>
    }
  </div>

  <!-- User info (name and role) -->
  @if (!avatarOnly) {
    <div class="text-left">
      <div [ngClass]="nameTextClass" class="font-medium text-gray-900">{{ userName }}</div>
      @if (showRole) {
        <div [ngClass]="roleTextClass" class="text-gray-500">{{ userRole }}</div>
      }
    </div>
  }
</div>
