<div class="bg-white rounded-md shadow-sm p-6 flex flex-col h-full">
  <div class="flex justify-between items-start mb-6">
    <div>
      <h3 class="text-4xl font-semibold text-gray-900">{{ value }}</h3>
      <p class="text-base text-gray-600 mt-1">{{ title }}</p>
    </div>
    <div class="p-2 text-gray-500">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-6 w-6"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="iconPath" />
      </svg>
    </div>
  </div>
  <div class="mt-auto text-right">
    <a [href]="detailsLink" class="text-sm text-blue-600 hover:text-blue-800 hover:underline"
      >more details →</a
    >
  </div>
</div>
