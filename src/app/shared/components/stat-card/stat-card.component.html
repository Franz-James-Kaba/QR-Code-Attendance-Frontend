<div class="bg-white rounded-md shadow-sm p-6 flex flex-col h-full">
  <!-- Header with icon and stats -->
  <div class="flex justify-between items-start">
    <div>
      <h3 class="text-4xl font-semibold text-gray-900">{{ value }}</h3>

    </div>
    <div class="p-2 text-gray-500">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-6 w-6"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="iconPath" />
      </svg>
    </div>
  </div>

  <!-- Footer with navigation -->
  <div class="mt-4 flex justify-between items-center">
    <h3 class="text-base text-gray-600 mt-1">{{ title }}</h3>
    <a
      [routerLink]="detailsLink"
      class="text-sm text-blue-600 hover:text-blue-800 hover:underline inline-flex items-center gap-1"
      >more details
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-4 w-4"
        viewBox="0 0 20 20"
        fill="currentColor"
      >
        <path
          fill-rule="evenodd"
          d="M10.293 5.293a1 1 0 011.414 0l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414-1.414L12.586 11H5a1 1 0 110-2h7.586l-2.293-2.293a1 1 0 010-1.414z"
          clip-rule="evenodd"
        />
      </svg>
    </a>
  </div>
</div>
